<label for="genre">Género: </label>

<select 
id="genre" 
(change)="onGenreChange($event)"
>
  <option 
  value="" 
  [selected]="selectedGenre() === null"
  >Todos los géneros</option>

  @for (genre of genres(); track genre.id) {

  <option 
  [value]="genre.id" 
  [selected]="selectedGenre() === genre.id"
  >
    {{ genre.name }}
  </option>

  }
</select>

<button type="button" (click)="clearGenreFilters()">
  Limpiar filtros
</button>
