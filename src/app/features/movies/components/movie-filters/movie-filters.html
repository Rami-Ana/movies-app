<div class="filters-bar">
  <div class="filter-group">
    <label for="genre">Género:</label>
    <select id="genre" (change)="onGenreChange($event)">
      <option value="" [selected]="selectedGenre() === null">Todos los géneros</option>
      @for (genre of genres(); track genre.id) {
        <option [value]="genre.id" [selected]="selectedGenre() === genre.id">
          {{ genre.name }}
        </option>
      }
    </select>
  </div>

  <div class="filter-group">
    <label for="sort-order">Ordenar por:</label>
    <select id="sort-order" (change)="onSortOrderChange($event)">
      <option value="popularity" [selected]="sortOrder() === 'popularity'">
        Popularidad
      </option>
      <option value="vote" [selected]="sortOrder() === 'vote'">
        Nota
      </option>
      <option value="release" [selected]="sortOrder() === 'release'">
        Fecha
      </option>
    </select>
  </div>

  <div class="filter-group vote-stepper-group">
    <span id="minimum-vote-label" class="vote-label">Nota mínima:</span>

    <div class="vote-stepper" role="group" aria-labelledby="minimum-vote-label">
      <
    <button
      type="button"
      class="btn-step"
      (click)="changeMinimumVote(-1)"
      [disabled]="(minimumVote() ?? 0) <= 0"
      aria-label="Restar un punto a la nota mínima"
    >
      −
    </button>

    <output class="vote-value" aria-live="polite">
      {{ minimumVote() ?? 0 }}
    </output>

    <button
      type="button"
      class="btn-step"
      (click)="changeMinimumVote(1)"
      [disabled]="(minimumVote() ?? 0) >= 10"
      aria-label="Sumar un punto a la nota mínima"
    >
      +
    </button>
  </div>
</div>

  <button type="button" class="btn-clear" (click)="clearFilters()">
    Limpiar filtros
  </button>
</div>
