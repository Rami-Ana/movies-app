
<form role="search" class="search-bar" (submit)="$event.preventDefault()">
  <label for="search-input" class="sr-only">
    Buscar películas
  </label>

  <div class="search-input-wrapper">
    <input
      #searchInput
      id="search-input"
      type="search"
      name="q"
      placeholder="Buscar películas..."
      aria-describedby="search-help"
      (input)="startSearch(searchInput.value)"
    />
  </div>

  <div class="search-status">
    <p id="search-help" class="search-bar-help">
      Escribe al menos 2 letras para buscar.
    </p>
  </div>
</form>
