<article class="actor-card">
    <a class="actor-link" [routerLink]="['/person', actor().id]">
        @if (actor().photo) {
        <img class="actor-photo" [src]="'https://image.tmdb.org/t/p/w185' + actor().photo" [alt]="actor().name" />
        } @else {
        <div class="actor-no-photo" aria-hidden="true">Sin foto</div>
        }

        <p class="actor-name">{{ actor().name }}</p>
        @if (actor().character) {
        <p class="actor-character">{{ actor().character }}</p>
        }
    </a>
</article>
