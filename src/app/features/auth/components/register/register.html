<form [formGroup]="registerForm">

    <label for="email">Correo electrónico: </label>

    <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com"><br>

    <label for="password">Contraseña: </label>

    <input id="password" type="password" formControlName="password" placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"><br>

    <label for="repeatPassword">Repetir contraseña: </label>

    <input id="repeatPassword" type="password" formControlName="repeatPassword" placeholder="Repite la contraseña"
        autocomplete="new-password"><br>

    <button type="submit">Registrarse</button>

    <hr>
    
    @if (
    registerForm.hasError('passwordsMismatch') &&
    registerForm.controls.repeatPassword.touched
    ) {
    <p>Las contraseñas no coinciden</p>
    }

</form>
